<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Contratación Docente</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <style>
        /* ========== ESTILOS (mismos de antes) ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #app { height: 100%; width: 100%; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; overflow: hidden; }
        .app-layout { display: flex; height: 100%; width: 100%; }
        .sidebar { width: 280px; background: #1e2a3a; color: white; display: flex; flex-direction: column; flex-shrink: 0; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 10; height: 100%; overflow-y: auto; }
        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid #2c3e50; margin-bottom: 20px; }
        .sidebar-header h2 { font-size: 1.4rem; font-weight: 600; }
        .sidebar-header p { font-size: 0.8rem; color: #8aa4b8; margin-top: 5px; }
        .nav-item { padding: 12px 20px; margin: 5px 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: 500; display: flex; align-items: center; gap: 12px; }
        .nav-item:hover { background: #2c3e50; }
        .nav-item.active { background: #0f6b8c; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .sidebar-divider { height: 1px; background: #2c3e50; margin: 15px 10px; }
        .main-content { flex: 1; overflow-y: auto; padding: 25px 30px; background: #f4f7fc; height: 100%; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 25px; margin-bottom: 25px; }
        .card h2 { margin-bottom: 20px; color: #1e2a3a; border-left: 5px solid #0f6b8c; padding-left: 15px; }
        .admin-options { display: flex; gap: 20px; flex-wrap: wrap; }
        .admin-card { background: #f8f9fa; border-radius: 10px; padding: 20px; width: 250px; text-align: center; cursor: pointer; transition: 0.2s; border: 1px solid #ddd; }
        .admin-card:hover { background: #e9ecef; transform: translateY(-2px); }
        .lista-container { max-height: 500px; overflow-y: auto; }
        .item-lista { background: #f9f9f9; border-left: 4px solid #0f6b8c; margin-bottom: 12px; padding: 12px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .item-info { flex: 1; margin-right: 10px; }
        .item-info p { margin: 4px 0; font-size: 0.9rem; }
        .item-actions { display: flex; gap: 8px; margin-top: 5px; }
        .btn-detalle { background: #17a2b8; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-editar { background: #ffc107; color: #1e2a3a; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-eliminar { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-pdf { background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-aprobar { background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        button { background: #0f6b8c; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-top: 10px; margin-right: 10px; }
        button:hover { background: #0a4c64; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #565e64; }
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .form-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 200px; }
        .radio-group { display: flex; flex-wrap: wrap; gap: 15px; margin: 10px 0; align-items: center; }
        .radio-group label { font-weight: normal; margin-left: 5px; }
        .buscador { margin-bottom: 20px; padding: 10px; width: 100%; max-width: 400px; border: 1px solid #ccc; border-radius: 6px; }
        .wizard-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 30px; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; }
        .step { flex: 1; text-align: center; font-weight: bold; color: #aaa; position: relative; }
        .step.active { color: #0f6b8c; }
        .step.completed { color: #28a745; }
        .resumen-item { margin-bottom: 15px; padding: 10px; background: #f8f9fa; border-radius: 6px; }
        .detalle-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .detalle-item { background: #f8f9fa; padding: 10px; border-radius: 6px; }
        .detalle-item strong { display: block; color: #0f6b8c; }
        .fuente-linea { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; margin: 10px 0; }
        .fuente-linea label { font-weight: normal; }
        .error { color: #dc3545; padding: 10px; }
        .login-container { display: flex; justify-content: center; align-items: center; height: 100%; width: 100%; background: #f0f2f5; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 400px; max-width: 90%; }
        .login-card h2 { text-align: center; margin-bottom: 25px; color: #1e2a3a; }
        .login-card input { margin-bottom: 20px; }
        .logout-btn { margin-top: auto; margin-bottom: 20px; background: #dc3545; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: calc(100% - 40px); margin-left: 20px; }
        .logout-btn:hover { background: #c82333; }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    const API_BASE = 'http://localhost:3000';
    let token = localStorage.getItem('token');
    let currentView = 'dashboard';
    let wizardData = { profesor: {}, solicitud: {}, contrato: {} };
    let currentStep = 1;
    let departamentos = [];
    let profesoresList = [];
    let solicitudesList = [];
    let contratosList = [];
    let adminSubview = 'departamentos';

    function formatearFecha(fechaIso) {
        if (!fechaIso) return 'N/A';
        if (fechaIso.match(/^\d{4}-\d{2}-\d{2}$/)) {
            const partes = fechaIso.split('-');
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }
        const partes = fechaIso.split('T');
        if (partes.length > 0 && partes[0].match(/^\d{4}-\d{2}-\d{2}$/)) {
            const ymd = partes[0].split('-');
            return `${ymd[2]}/${ymd[1]}/${ymd[0]}`;
        }
        return fechaIso;
    }

    async function fetchAPI(url, method = 'GET', body = null) {
        const opts = {
            method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(`${API_BASE}${url}`, opts);
        if (res.status === 401) {
            localStorage.removeItem('token');
            token = null;
            renderApp();
            throw new Error('Sesión expirada. Inicie sesión nuevamente.');
        }
        if (!res.ok) {
            const errData = await res.json().catch(() => ({ mensaje: res.statusText }));
            throw new Error(errData.mensaje || errData.error || 'Error en la petición');
        }
        return res.json();
    }

    async function login(email, password) {
        const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        if (!res.ok) {
            const error = await res.json();
            throw new Error(error.mensaje || 'Error al iniciar sesión');
        }
        const data = await res.json();
        localStorage.setItem('token', data.token);
        token = data.token;
        renderApp();
    }

    function logout() {
        localStorage.removeItem('token');
        token = null;
        renderApp();
    }

    async function loadInitialData() {
        try {
            departamentos = await fetchAPI('/departamentos');
            profesoresList = await fetchAPI('/profesores');
            solicitudesList = await fetchAPI('/solicitudes');
            contratosList = await fetchAPI('/contratos');
        } catch (err) { console.error(err); }
    }

    // ========== APROBAR SOLICITUD ==========
    async function aprobarSolicitud(id) {
        if (!confirm('¿Aprobar esta solicitud? Luego podrá generar el contrato.')) return;
        try {
            await fetchAPI(`/solicitudes/aprobar/${id}`, 'PUT');
            alert('Solicitud aprobada correctamente');
            await loadSolicitudes();
            if (currentView === 'solicitudes') renderSolicitudesView();
        } catch (err) {
            alert('Error al aprobar: ' + err.message);
        }
    }

    // ========== DEPARTAMENTOS CRUD ==========
    async function loadDepartamentos() { departamentos = await fetchAPI('/departamentos'); }
    async function eliminarDepartamento(id) {
        if (!confirm('¿Eliminar este departamento? Se perderá la referencia en profesores y solicitudes.')) return;
        try {
            await fetchAPI(`/departamentos/${id}`, 'DELETE');
            alert('Departamento eliminado');
            await loadDepartamentos();
            if (currentView === 'admin' && adminSubview === 'departamentos') renderAdminDepartamentosView();
            await loadInitialData();
        } catch (err) { alert('Error: ' + err.message); }
    }
    async function editarDepartamento(id) {
        const depto = departamentos.find(d => d.id_departamento == id);
        if (!depto) return;
        const nuevoNombre = prompt('Nuevo nombre del departamento:', depto.nombre);
        if (nuevoNombre && nuevoNombre.trim()) {
            try {
                await fetchAPI(`/departamentos/${id}`, 'PUT', { nombre: nuevoNombre });
                alert('Departamento actualizado');
                await loadDepartamentos();
                if (currentView === 'admin' && adminSubview === 'departamentos') renderAdminDepartamentosView();
                await loadInitialData();
            } catch (err) { alert('Error: ' + err.message); }
        }
    }
    async function crearDepartamento() {
        const nombre = prompt('Ingrese el nombre del nuevo departamento:');
        if (nombre && nombre.trim()) {
            try {
                await fetchAPI('/departamentos', 'POST', { nombre: nombre.trim() });
                alert('Departamento creado');
                await loadDepartamentos();
                if (currentView === 'admin' && adminSubview === 'departamentos') renderAdminDepartamentosView();
                await loadInitialData();
            } catch (err) { alert('Error: ' + err.message); }
        }
    }
    async function renderAdminDepartamentosView() {
        const main = document.getElementById('mainContent');
        main.innerHTML = `
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>🏢 Gestión de Departamentos</h2>
                    <button id="btnVolverAdmin" class="btn-secondary">← Volver a Administración</button>
                </div>
                <button id="btnNuevoDepto">+ Nuevo Departamento</button>
                <div id="listaDeptosContainer" class="lista-container"></div>
            </div>
        `;
        document.getElementById('btnNuevoDepto').addEventListener('click', crearDepartamento);
        document.getElementById('btnVolverAdmin').addEventListener('click', () => renderAdminMainView());
        const container = document.getElementById('listaDeptosContainer');
        if (departamentos.length === 0) container.innerHTML = '<p>No hay departamentos registrados.</p>';
        else {
            container.innerHTML = departamentos.map(d => `
                <div class="item-lista">
                    <div class="item-info"><strong>${d.nombre}</strong> (ID: ${d.id_departamento})</div>
                    <div class="item-actions">
                        <button class="btn-editar" data-id="${d.id_departamento}">✏️ Editar</button>
                        <button class="btn-eliminar" data-id="${d.id_departamento}">🗑️ Eliminar</button>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.btn-editar').forEach(btn => btn.addEventListener('click', (e) => editarDepartamento(btn.dataset.id)));
            document.querySelectorAll('.btn-eliminar').forEach(btn => btn.addEventListener('click', (e) => eliminarDepartamento(btn.dataset.id)));
        }
    }
    async function renderAdminUsuariosView() {
        await loadUsuarios();
        const main = document.getElementById('mainContent');
        main.innerHTML = `
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>👥 Gestión de Usuarios</h2>
                    <button id="btnVolverAdminUsuarios" class="btn-secondary">← Volver a Administración</button>
                </div>
                <button id="btnNuevoUsuario">+ Nuevo Usuario</button>
                <div id="listaUsuariosContainer" class="lista-container"></div>
            </div>
        `;
        document.getElementById('btnNuevoUsuario').addEventListener('click', crearUsuario);
        document.getElementById('btnVolverAdminUsuarios').addEventListener('click', () => renderAdminMainView());
        const container = document.getElementById('listaUsuariosContainer');
        if (usuariosList.length === 0) container.innerHTML = '<p>No hay usuarios registrados.</p>';
        else {
            container.innerHTML = usuariosList.map(u => `
                <div class="item-lista">
                    <div class="item-info">
                        <strong>${u.nombre}</strong> (${u.email})<br>
                        ID: ${u.id_usuario}
                    </div>
                    <div class="item-actions">
                        <button class="btn-editar" data-id="${u.id_usuario}">✏️ Editar</button>
                        <button class="btn-eliminar" data-id="${u.id_usuario}">🗑️ Eliminar</button>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.btn-editar').forEach(btn => btn.addEventListener('click', (e) => editarUsuario(btn.dataset.id)));
            document.querySelectorAll('.btn-eliminar').forEach(btn => btn.addEventListener('click', (e) => eliminarUsuario(btn.dataset.id)));
        }
    }
    async function renderAdminMainView() {
        const main = document.getElementById('mainContent');
        main.innerHTML = `
            <div class="card">
                <h2>⚙️ Administración del Sistema</h2>
                <div class="admin-options">
                    <div class="admin-card" id="adminDeptos"><h3>🏢 Departamentos</h3><p>Crear, editar y eliminar departamentos.</p></div>
                    <div class="admin-card" id="adminUsuarios"><h3>👥 Usuarios</h3><p>Gestión de usuarios (CRUD completo).</p></div>
                </div>
            </div>
        `;
        document.getElementById('adminDeptos').addEventListener('click', () => { adminSubview = 'departamentos'; renderAdminDepartamentosView(); });
        document.getElementById('adminUsuarios').addEventListener('click', () => { adminSubview = 'usuarios'; renderAdminUsuariosView(); });
    }

    // ========== USUARIOS ==========
    let usuariosList = [];
    async function loadUsuarios() { usuariosList = await fetchAPI('/usuarios'); }
    async function eliminarUsuario(id) {
        if (!confirm('¿Eliminar este usuario?')) return;
        try {
            await fetchAPI(`/usuarios/${id}`, 'DELETE');
            alert('Usuario eliminado');
            await loadUsuarios();
            renderAdminUsuariosView();
        } catch (err) { alert('Error: ' + err.message); }
    }
    async function editarUsuario(id) {
        const usuario = usuariosList.find(u => u.id_usuario == id);
        if (!usuario) return;
        const nuevoNombre = prompt('Nuevo nombre:', usuario.nombre);
        const nuevoEmail = prompt('Nuevo email:', usuario.email);
        let nuevaPassword = prompt('Nueva contraseña (dejar vacío para no cambiar):', '');
        if (nuevoNombre && nuevoEmail) {
            const payload = { nombre: nuevoNombre, email: nuevoEmail };
            if (nuevaPassword && nuevaPassword.trim() !== '') payload.password = nuevaPassword;
            try {
                await fetchAPI(`/usuarios/${id}`, 'PUT', payload);
                alert('Usuario actualizado');
                await loadUsuarios();
                renderAdminUsuariosView();
            } catch (err) { alert('Error: ' + err.message); }
        }
    }
    async function crearUsuario() {
        const nombre = prompt('Ingrese el nombre completo:');
        if (!nombre) return;
        const email = prompt('Ingrese el correo electrónico:');
        if (!email) return;
        const password = prompt('Ingrese la contraseña:');
        if (!password) return;
        try {
            await fetchAPI('/usuarios', 'POST', { nombre, email, password });
            alert('Usuario creado');
            await loadUsuarios();
            renderAdminUsuariosView();
        } catch (err) { alert('Error: ' + err.message); }
    }

    // ========== PROFESORES ==========
    let profesoresFiltrados = [];
    function filtrarProfesores() {
        const texto = document.getElementById('buscadorProfesores')?.value.toLowerCase() || '';
        if (!texto) profesoresFiltrados = [...profesoresList];
        else {
            profesoresFiltrados = profesoresList.filter(p => 
                (p.nombre && p.nombre.toLowerCase().includes(texto)) ||
                (p.apellidos && p.apellidos.toLowerCase().includes(texto)) ||
                (p.carnet_identidad && p.carnet_identidad.toLowerCase().includes(texto))
            );
        }
        renderListaProfesoresFiltrada();
    }
    function renderListaProfesoresFiltrada() {
        const container = document.getElementById('listaProfesoresContainer');
        if (!container) return;
        if (profesoresFiltrados.length === 0) { container.innerHTML = '<p>No hay profesores coincidentes.</p>'; return; }
        container.innerHTML = profesoresFiltrados.map(p => `
            <div class="item-lista">
                <div class="item-info">
                    <strong>${p.nombre} ${p.apellidos}</strong><br>
                    CI: ${p.carnet_identidad || 'N/A'} | Tel: ${p.telefono || 'N/A'}<br>
                    Categoría: ${p.categoria_docente || 'N/A'} | Depto: ${p.id_departamento || 'N/A'}<br>
                    Dirección: ${p.direccion || ''} ${p.municipio ? `, ${p.municipio}` : ''} ${p.provincia ? `, ${p.provincia}` : ''}
                </div>
                <div class="item-actions">
                    <button class="btn-editar" data-id="${p.id_profesor}">✏️ Editar</button>
                    <button class="btn-eliminar" data-id="${p.id_profesor}">🗑️ Eliminar</button>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.btn-editar').forEach(btn => btn.addEventListener('click', (e) => editarProfesor(btn.dataset.id)));
        document.querySelectorAll('.btn-eliminar').forEach(btn => btn.addEventListener('click', (e) => eliminarProfesor(btn.dataset.id)));
    }
    async function loadProfesores() {
        profesoresList = await fetchAPI('/profesores');
        profesoresFiltrados = [...profesoresList];
        if (currentView === 'profesores') renderProfesoresView();
    }
    async function eliminarProfesor(id) {
        if (!confirm('¿Eliminar este profesor? También se eliminarán sus solicitudes y contratos asociados.')) return;
        try {
            await fetchAPI(`/profesores/${id}`, 'DELETE');
            alert('Profesor eliminado');
            await loadProfesores();
            if (currentView === 'profesores') renderProfesoresView();
        } catch (err) {
            // Mensaje amigable para error de clave foránea
            if (err.message.includes('foreign key') || err.message.includes('referenced')) {
                alert('No se puede eliminar el profesor porque tiene solicitudes o contratos asociados. Primero elimine esas dependencias.');
            } else {
                alert('Error: ' + err.message);
            }
        }
    }
    async function editarProfesor(id) {
        const profesor = profesoresList.find(p => p.id_profesor == id);
        if (!profesor) return;
        const main = document.getElementById('mainContent');
        const fuenteHtml = `
            <div class="fuente-linea">
                <label><strong>Centro de trabajo principal:</strong></label>
                <input type="text" id="editCentroTexto" style="width: 300px;" placeholder="Escriba el centro" value="${profesor.fuente_procedencia && profesor.fuente_procedencia.startsWith('Centro de trabajo principal:') ? profesor.fuente_procedencia.replace('Centro de trabajo principal:', '').trim() : ''}">
            </div>
            <div class="radio-group">
                <label><input type="radio" name="editFuenteRadio" value="Interrupto" ${profesor.fuente_procedencia === 'Interrupto' ? 'checked' : ''}> Interrupto</label>
                <label><input type="radio" name="editFuenteRadio" value="Reserva laboral" ${profesor.fuente_procedencia === 'Reserva laboral' ? 'checked' : ''}> Reserva laboral</label>
                <label><input type="radio" name="editFuenteRadio" value="Jubilado" ${profesor.fuente_procedencia === 'Jubilado' ? 'checked' : ''}> Jubilado</label>
                <label><input type="radio" name="editFuenteRadio" value="Cuenta propia" ${profesor.fuente_procedencia === 'Cuenta propia' ? 'checked' : ''}> Cuenta propia</label>
                <label><input type="radio" name="editFuenteRadio" value="Ama de casa" ${profesor.fuente_procedencia === 'Ama de casa' ? 'checked' : ''}> Ama de casa</label>
                <label><input type="radio" name="editFuenteRadio" value="" ${!profesor.fuente_procedencia || (!profesor.fuente_procedencia.startsWith('Centro de trabajo principal:') && !['Interrupto','Reserva laboral','Jubilado','Cuenta propia','Ama de casa'].includes(profesor.fuente_procedencia)) ? 'checked' : ''}> Ninguna</label>
            </div>
        `;
        main.innerHTML = `
            <div class="card">
                <h2>✏️ Editar Profesor</h2>
                <form id="editProfesorForm">
                    <div class="form-row"><div class="form-group"><label>Nombre *</label><input type="text" id="editNombre" value="${profesor.nombre || ''}" required></div>
                    <div class="form-group"><label>Apellidos *</label><input type="text" id="editApellidos" value="${profesor.apellidos || ''}" required></div></div>
                    <div class="form-row"><div class="form-group"><label>Carnet Identidad</label><input type="text" id="editCarnet" value="${profesor.carnet_identidad || ''}"></div>
                    <div class="form-group"><label>Fecha nacimiento</label><input type="date" id="editFechaNac" value="${profesor.fecha_nacimiento || ''}"></div></div>
                    <div class="form-row"><div class="form-group"><label>Sexo</label><select id="editSexo"><option value="">Seleccione</option><option value="M" ${profesor.sexo === 'M' ? 'selected' : ''}>Masculino</option><option value="F" ${profesor.sexo === 'F' ? 'selected' : ''}>Femenino</option></select></div>
                    <div class="form-group"><label>Teléfono</label><input type="text" id="editTelefono" value="${profesor.telefono || ''}"></div></div>
                    <div class="form-group"><label>Dirección (calle)</label><textarea id="editDireccion">${profesor.direccion || ''}</textarea></div>
                    <div class="form-row"><div class="form-group"><label>Provincia</label><input type="text" id="editProvincia" value="${profesor.provincia || ''}"></div>
                    <div class="form-group"><label>Municipio</label><input type="text" id="editMunicipio" value="${profesor.municipio || ''}"></div></div>
                    <div class="form-row"><div class="form-group"><label>Email</label><input type="email" id="editEmail" value="${profesor.email || ''}"></div>

    let contratosFiltrados = [];

        const texto = document.getElementById('buscadorContratos')?.value.toLowerCase() || '';
        if (!texto) contratosFiltrados = [...contratosList];
        else {
            contratosFiltrados = contratosList.filter(c => 
                (c.id_contrato && c.id_contrato.toString().includes(texto)) ||
                (c.id_solicitud && c.id_solicitud.toString().includes(texto)) ||
                (c.tipo_contrato && c.tipo_contrato.toLowerCase().includes(texto))
            );
        }
        renderListaContratosFiltrada();

    function validateStep() {
        if (currentStep === 1) {
            const nombre = document.getElementById('wNombre')?.value;
            const apellidos = document.getElementById('wApellidos')?.value;
            const depto = document.getElementById('wDepartamento')?.value;
            if (!nombre || !apellidos || !depto) { alert('Nombre, apellidos y departamento del profesor son obligatorios'); return false; }
            const carnet = document.getElementById('wCarnet')?.value?.trim();
            if (carnet !== "") {
                const existe = profesoresList.some(p => p.carnet_identidad === carnet && p.id_profesor != wizardData.profesor.id);
                if (existe) { alert(`El carnet "${carnet}" ya está registrado. Usa otro carnet o selecciona el profesor existente.`); return false; }
            }
        } else if (currentStep === 2) {
            const asignatura = document.getElementById('wAsignatura')?.value;
            const horas = document.getElementById('wHoras')?.value;
            const centro = document.getElementById('wCentro')?.value;
            const deptoSol = document.getElementById('wSolicitudDepartamento')?.value;
            if (!asignatura || !horas || !centro || !deptoSol) { alert('Asignatura, horas, centro de trabajo y departamento solicitante son obligatorios'); return false; }
        } else if (currentStep === 3) {
            const salario = document.getElementById('wSalario')?.value;
            if (!salario || isNaN(parseFloat(salario))) { alert('El salario es obligatorio'); return false; }
        }
        return true;
    }
    function saveCurrentStepData() {
        if (currentStep === 1) {
            const emptyToNull = (val) => (val === "" ? null : val);
            let fuente = null;
            const centroTexto = document.getElementById('wCentroTexto')?.value.trim();
            if (centroTexto) fuente = `Centro de trabajo principal: ${centroTexto}`;
            else {
                const radio = document.querySelector('input[name="fuenteRadio"]:checked');
                if (radio && radio.value) fuente = radio.value;
            }
            wizardData.profesor = {
                nombre: document.getElementById('wNombre')?.value,
                apellidos: document.getElementById('wApellidos')?.value,
                carnet_identidad: emptyToNull(document.getElementById('wCarnet')?.value),
                fecha_nacimiento: emptyToNull(document.getElementById('wFechaNac')?.value),
                sexo: emptyToNull(document.getElementById('wSexo')?.value),
                telefono: emptyToNull(document.getElementById('wTelefono')?.value),
                direccion: emptyToNull(document.getElementById('wDireccion')?.value),
                provincia: emptyToNull(document.getElementById('wProvincia')?.value),
                municipio: emptyToNull(document.getElementById('wMunicipio')?.value),
                email: emptyToNull(document.getElementById('wEmail')?.value),
                especialidad: emptyToNull(document.getElementById('wEspecialidad')?.value),
                categoria_docente: emptyToNull(document.getElementById('wCategoria')?.value),
                grado_cientifico: emptyToNull(document.getElementById('wGrado')?.value),
                graduado_carrera: emptyToNull(document.getElementById('wGraduado')?.value),
                fuente_procedencia: fuente,
                id_departamento: document.getElementById('wDepartamento')?.value,
                id: wizardData.profesor.id || null
            };
        } else if (currentStep === 2) {
            wizardData.solicitud = {
                asignatura: document.getElementById('wAsignatura')?.value,
                carrera: document.getElementById('wCarrera')?.value || null,
                horas_semanales: document.getElementById('wHoras')?.value,
                centro_trabajo: document.getElementById('wCentro')?.value,
                facultad: document.getElementById('wFacultad')?.value || null,
                estado: document.getElementById('wEstado')?.value,
                fecha_solicitud: document.getElementById('wFechaSol')?.value || null,
                id_profesor: document.getElementById('wIdProfesor')?.value || null,
                id_departamento: document.getElementById('wSolicitudDepartamento')?.value
            };
        } else if (currentStep === 3) {
            wizardData.contrato = {
                fecha_inicio: document.getElementById('wFechaInicio')?.value || null,
                fecha_fin: document.getElementById('wFechaFin')?.value || null,
                salario: document.getElementById('wSalario')?.value,
                tipo_contrato: document.getElementById('wTipoContrato')?.value || null
            };
        }
    }

    // ========== RENDER DE VISTAS ==========
    async function renderView(view) {
        currentView = view;
        if (view === 'dashboard') {
            const main = document.getElementById('mainContent');
            main.innerHTML = `<div class="card"><h2>📌 Panel Principal</h2><p>Bienvenido al sistema de gestión de contratación.</p><hr><h3>Estadísticas</h3><ul><li>👨‍🏫 Profesores: ${profesoresList.length}</li><li>📄 Solicitudes: ${solicitudesList.length}</li><li>📑 Contratos: ${contratosList.length}</li><li>🏢 Departamentos: ${departamentos.length}</li></ul></div>`;
        } else if (view === 'profesores') { await loadProfesores(); await renderProfesoresView(); }
        else if (view === 'solicitudes') { await loadSolicitudes(); await renderSolicitudesView(); }
        else if (view === 'contratos') { await loadContratos(); await renderContratosView(); }
        else if (view === 'admin') { await renderAdminMainView(); }
    }

    async function renderApp() {
        const appDiv = document.getElementById('app');
        if (!token) {
            appDiv.innerHTML = `
                <div class="login-container">
                    <div class="login-card">
                        <h2>🔐 Iniciar Sesión</h2>
                        <form id="loginForm">
                            <input type="email" id="email" placeholder="Correo electrónico" required>
                            <input type="password" id="password" placeholder="Contraseña" required>
                            <button type="submit" style="width:100%">Ingresar</button>
                        </form>
                        <p style="text-align:center; margin-top:15px;">Usuario de prueba: admin@umcc.cu / adminis</p>
                    </div>
                </div>
            `;
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                try {
                    await login(email, password);
                } catch (err) {
                    alert(err.message);
                }
            });
            return;
        }
        await loadInitialData();
        appDiv.innerHTML = `
            <div class="app-layout">
                <div class="sidebar">
                    <div class="sidebar-header">
                        <h2>🏛️ Sistema de Contratación</h2>
                        <p>Gestión Docente</p>
                    </div>
                    <div class="nav-item" data-view="dashboard">📊 Panel Principal</div>
                    <div class="nav-item" data-view="profesores">👨‍🏫 Profesores</div>
                    <div class="nav-item" data-view="solicitudes">📄 Solicitudes</div>
                    <div class="nav-item" data-view="contratos">📑 Contratos</div>
                    <div class="sidebar-divider"></div>
                    <div class="nav-item" data-view="admin">⚙️ Administración</div>
                    <button class="logout-btn" id="logoutBtn">🚪 Cerrar sesión</button>
                </div>
                <div class="main-content" id="mainContent">
                    <div class="card"><h2>Bienvenido</h2><p>Seleccione una opción del menú lateral.</p></div>
                </div>
            </div>
        `;
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
                renderView(item.getAttribute('data-view'));
            });
        });
        document.querySelector('.nav-item[data-view="dashboard"]').classList.add('active');
        renderView('dashboard');
    }

    renderApp();
</script>
</body>
</html>
